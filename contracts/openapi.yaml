openapi: 3.1.0
info:
  title: Optata Core API
  version: 0.7.0
  description: >
    Contract first. This file is the single source of truth for the HTTP API.
    Skeleton for S0: only zone A (public data) and the health check are defined.
    Endpoints for orders, owners, analyses and Demand Pro are added in the
    sprint that builds them, before any code.

    Changed from the 0.5.0 draft in bilag 16 to follow projektgrundlag v5.1:
    there is no e-mail session. Every non-anonymous call requires MitID.
servers:
  - url: https://api.optata.dk/v1

security:
  - {}

tags:
  - name: public
  - name: ops

components:
  securitySchemes:
    mitid:
      type: openIdConnect
      openIdConnectUrl: https://broker.optata.dk/.well-known/openid-configuration
    mitidStepUp:
      type: apiKey
      in: header
      name: X-Step-Up-Ref
    orgAuth:
      type: openIdConnect
      openIdConnectUrl: https://broker.optata.dk/erhverv/.well-known/openid-configuration
    staffAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message, trace_id]
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - ORDER_ALREADY_ACTIVE
            - OWNERSHIP_NOT_VERIFIED
            - VERIFICATION_EXPIRED
            - MISSING_CONSENT
            - STEP_UP_REQUIRED
            - REVEAL_BLOCKED
            - PROFILE_NOT_APPROVED
            - SUBSCRIPTION_EXPIRED
            - MESSAGE_REDACTED
            - K_ANONYMITY_BLOCKED
            - RATE_LIMITED
            - NO_SOURCE
            - NO_DATE
            - QUOTE_MISMATCH
            - OPINION
            - EAN_REQUIRED
            - SCOPE_INCOMPLETE
            - REVISION_NOT_ACCEPTED
            - TOO_MANY_DIMENSIONS
            - GEO_TOO_GRANULAR
            - NOT_FOUND
        message: { type: string }
        trace_id: { type: string }

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ok] }

    AreaSummary:
      type: object
      required: [area_id, level, name, dwelling_count]
      additionalProperties: false
      properties:
        area_id: { type: string }
        level: { type: string, enum: [MUNICIPALITY, ZIP, NEIGHBOURHOOD, STREET] }
        parent_id: { type: [string, "null"] }
        name: { type: string }
        dwelling_count: { type: integer }

    Count:
      type: object
      required: [key, count]
      additionalProperties: false
      properties:
        key: { type: string }
        count: { type: integer }

    Fakta:
      type: object
      description: Housing stock in the area, from the public registers. Zone A only.
      required: [dwelling_count, non_residential_count, by_usage, by_owner_kind, areal, opfoerelsesaar]
      additionalProperties: false
      properties:
        dwelling_count: { type: integer }
        non_residential_count: { type: integer }
        by_usage: { type: array, items: { $ref: '#/components/schemas/Count' } }
        by_owner_kind: { type: array, items: { $ref: '#/components/schemas/Count' } }
        areal:
          type: [object, "null"]
          required: [p25, median, p75]
          additionalProperties: false
          properties:
            p25: { type: number }
            median: { type: number }
            p75: { type: number }
        opfoerelsesaar:
          type: [object, "null"]
          required: [min, median, max]
          additionalProperties: false
          properties:
            min: { type: integer }
            median: { type: integer }
            max: { type: integer }

    AreaProfile:
      type: object
      required: [area, path, children, layers, meta]
      additionalProperties: false
      properties:
        area: { $ref: '#/components/schemas/AreaSummary' }
        path:
          description: The area's ancestors from municipality down to the area itself.
          type: array
          items: { $ref: '#/components/schemas/AreaSummary' }
        children:
          type: array
          items: { $ref: '#/components/schemas/AreaSummary' }
        layers:
          type: object
          required: [fakta, bevaegelse, hverdag, efterspoergsel]
          additionalProperties: false
          properties:
            fakta: { $ref: '#/components/schemas/Fakta' }
            bevaegelse:
              description: Claims with source and date. Empty until the agent exists (S2).
              type: array
              maxItems: 0
            hverdag:
              description: Not built yet. Null means no data, never zero.
              type: "null"
            efterspoergsel:
              description: >
                Aggregated demand, k >= 5. Null means no data yet, never zero.
                Only null is allowed until the zone C aggregates exist.
              type: "null"
        meta:
          type: object
          required: [layer_status, synthetic, data_as_of, density_frozen]
          additionalProperties: false
          properties:
            layer_status:
              type: object
              required: [fakta, bevaegelse, hverdag, efterspoergsel]
              additionalProperties: false
              properties:
                fakta: { type: string, enum: [OK, NO_DATA_YET] }
                bevaegelse: { type: string, enum: [OK, NO_DATA_YET] }
                hverdag: { type: string, enum: [OK, NO_DATA_YET] }
                efterspoergsel: { type: string, enum: [OK, NO_DATA_YET] }
            synthetic:
              description: True when the figures come from generated test data.
              type: boolean
            data_as_of: { type: [string, "null"], format: date-time }
            density_frozen: { type: boolean }

    QualityFlags:
      type: object
      description: Field name to flag. Open by design; values are never personal data.
      additionalProperties: { type: string }

    Property:
      type: object
      required: [address_id, bfe, zip_id, attrs]
      additionalProperties: false
      properties:
        address_id: { type: string, format: uuid }
        bfe: { type: string }
        municipality_id: { type: string }
        zip_id: { type: string }
        neighbourhood_id: { type: [string, "null"] }
        street_id: { type: [string, "null"] }
        owner_kind: { type: string, enum: [PRIVATE, COMPANY, ANDELSFORENING] }
        attrs:
          type: object
          description: BBR attributes. Open by design; zone A only.
        quality_flags: { $ref: '#/components/schemas/QualityFlags' }
        valid_from: { type: string, format: date }
        recorded_at: { type: string, format: date-time }

paths:
  /health:
    get:
      tags: [ops]
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /areas:
    get:
      tags: [public]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - name: level
          in: query
          schema: { type: string, enum: [MUNICIPALITY, ZIP, NEIGHBOURHOOD, STREET] }
      responses:
        "200":
          description: Areas matching the query
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AreaSummary' }

  /areas/{area_id}/profile:
    get:
      tags: [public]
      parameters:
        - { name: area_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Area profile with four layers. Layers without data are null, never zero.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AreaProfile' }
        "404":
          description: Unknown area
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /properties/{address_id}:
    get:
      tags: [public]
      parameters:
        - { name: address_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Zone A lookup for one address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        "404":
          description: Unknown address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
