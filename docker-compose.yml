# Local development database. Synthetic data only.
# The password is a local-only default and must never be reused elsewhere.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: optata_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d optata_dev"]
      interval: 2s
      timeout: 2s
      retries: 30
