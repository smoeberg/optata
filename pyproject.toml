[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optata"
version = "0.1.0"
description = "Optata core: verified housing demand on top of public property registers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "import-linter>=2",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.scripts]
optata-fixtures = "tools.fixtures.cli:main"
optata-migrate = "tools.migrate:main"

[tool.setuptools.packages.find]
include = ["apps*", "core*", "workers*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Module boundaries (ADR-001). `core` holds the rules and must not depend on
# transport, workers or tooling. Domain modules talk to each other through
# events or explicit interfaces, never by importing each other.
[tool.importlinter]
root_packages = ["apps", "core", "workers", "tools"]

[[tool.importlinter.contracts]]
name = "core must not import apps, workers or tools"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["apps", "workers", "tools"]

[[tool.importlinter.contracts]]
name = "core domain modules are independent of each other"
type = "independence"
modules = [
  "core.registry",
  "core.orderbook",
  "core.identity",
  "core.verification",
  "core.disclosure",
  "core.relay",
  "core.consent",
  "core.agent",
  "core.insights",
  "core.billing",
]
